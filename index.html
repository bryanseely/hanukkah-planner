<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanukkah Gift Planner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(to bottom, #0f172a, #1e3a8a); /* Navy to Blue Gradient */
            min-height: 100vh;
            color: #1e293b;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        .candle-group { cursor: pointer; pointer-events: bounding-box; }
        .candle-group:hover rect { fill-opacity: 0.9; }

        .flame {
            opacity: 0;
            transform-origin: center bottom;
            transform: scale(0.5);
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            fill: #fbbf24;
            filter: drop-shadow(0 0 4px #f59e0b);
            display: block; 
        }

        .flame.lit {
            opacity: 1;
            transform: scale(1);
            animation: subtle-flicker 2s infinite alternate ease-in-out;
        }

        @keyframes subtle-flicker {
            0% { transform: scale(1) skewX(-1deg); opacity: 0.95; }
            25% { transform: scale(1.02) skewX(0deg); opacity: 1; }
            50% { transform: scale(1) skewX(1deg); opacity: 0.95; }
            75% { transform: scale(1.02) skewX(0deg); opacity: 1; }
            100% { transform: scale(1) skewX(-0.5deg); opacity: 0.95; }
        }

        .gift-checkbox:checked + div { background-color: #10b981; border-color: #10b981; }
        .gift-checkbox:checked + div svg { display: block; }
        .purchased-text { color: #059669; font-weight: 600; }
        .master-header { background: linear-gradient(135deg, #1e3a8a 0%, #1e40af 100%); color: white; }
        
        /* Drag Styles */
        .draggable-item { cursor: grab; }
        .draggable-item:active { cursor: grabbing; }
        .dragging { opacity: 0.5; border: 2px dashed #3b82f6; }
    </style>
</head>
<body class="min-h-screen pb-12">

    <header class="text-center pt-8 pb-6 px-4">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-2 drop-shadow-md">Hanukkah Planner</h1>
        <p class="text-blue-200 text-lg">8 Nights of Joy for Ben & Lev</p>
        <div id="connection-status" class="text-xs text-blue-300 mt-2">Connecting to cloud...</div>
    </header>

    <!-- Menorah Interaction -->
    <div class="max-w-4xl mx-auto mb-10 px-4">
        <div class="glass-panel rounded-2xl p-6 flex flex-col items-center">
            <p class="text-sm text-slate-500 mb-4 font-semibold uppercase tracking-wider">Tap candles to light</p>
            <svg class="w-full max-w-[500px] h-auto" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
                <path d="M140 220 L260 220 L250 240 L150 240 Z" fill="#94a3b8" stroke="#475569" stroke-width="2"/>
                <rect x="190" y="90" width="20" height="130" fill="#cbd5e1" stroke="#475569" stroke-width="2"/>
                <path d="M40 100 Q40 160 190 160 Q360 160 360 100" fill="none" stroke="#cbd5e1" stroke-width="8"/>
                <path d="M80 100 Q80 140 200 145 Q320 140 320 100" fill="none" stroke="#cbd5e1" stroke-width="8"/>
                <path d="M120 100 Q120 130 200 130 Q280 130 280 100" fill="none" stroke="#cbd5e1" stroke-width="8"/>
                <path d="M160 100 Q160 120 200 120 Q240 120 240 100" fill="none" stroke="#cbd5e1" stroke-width="8"/>
                <!-- Candles -->
                <g class="candle-group" onclick="toggleCandle('shamash')">
                    <rect x="180" y="20" width="40" height="100" fill="transparent" />
                    <rect x="192" y="40" width="16" height="50" fill="#3b82f6" stroke="#1d4ed8" stroke-width="1"/>
                    <path class="flame" id="flame-shamash" d="M200 40 Q205 30 200 10 Q195 30 200 40 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('1')">
                    <rect x="20" y="20" width="40" height="90" fill="transparent" />
                    <rect x="32" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-1" d="M40 60 Q45 50 40 30 Q35 50 40 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('2')">
                    <rect x="60" y="20" width="40" height="90" fill="transparent" />
                    <rect x="72" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-2" d="M80 60 Q85 50 80 30 Q75 50 80 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('3')">
                    <rect x="100" y="20" width="40" height="90" fill="transparent" />
                    <rect x="112" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-3" d="M120 60 Q125 50 120 30 Q115 50 120 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('4')">
                    <rect x="140" y="20" width="40" height="90" fill="transparent" />
                    <rect x="152" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-4" d="M160 60 Q165 50 160 30 Q155 50 160 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('5')">
                    <rect x="220" y="20" width="40" height="90" fill="transparent" />
                    <rect x="232" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-5" d="M240 60 Q245 50 240 30 Q235 50 240 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('6')">
                    <rect x="260" y="20" width="40" height="90" fill="transparent" />
                    <rect x="272" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-6" d="M280 60 Q285 50 280 30 Q275 50 280 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('7')">
                    <rect x="300" y="20" width="40" height="90" fill="transparent" />
                    <rect x="312" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-7" d="M320 60 Q325 50 320 30 Q315 50 320 60 Z" />
                </g>
                <g class="candle-group" onclick="toggleCandle('8')">
                    <rect x="340" y="20" width="40" height="90" fill="transparent" />
                    <rect x="352" y="60" width="16" height="40" fill="#60a5fa" stroke="#2563eb" stroke-width="1"/>
                    <path class="flame" id="flame-8" d="M360 60 Q365 50 360 30 Q355 50 360 60 Z" />
                </g>
            </svg>
        </div>
    </div>

    <!-- Main Grid -->
    <main class="max-w-6xl mx-auto px-4">
        <div id="days-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-12"></div>

        <!-- Master Stash Section -->
        <div class="glass-panel rounded-2xl overflow-hidden mb-12">
            <div class="master-header p-4 border-b border-blue-400/30 flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-3xl">🎁</span>
                    <div>
                        <h2 class="text-2xl font-bold text-white">Master Gift Stash</h2>
                        <p class="text-blue-200 text-sm">Track gifts before assigning them</p>
                    </div>
                </div>
            </div>
            
            <div class="p-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <!-- Ben's Master List -->
                    <div class="bg-blue-50/50 rounded-xl p-5 border border-blue-100">
                        <label class="block text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
                            <span class="w-2 h-8 bg-blue-600 rounded-full inline-block"></span>
                            Ben's Stash
                        </label>
                        <ul id="master-list-Ben" class="space-y-2 mb-4 min-h-[50px]"></ul>
                        <div class="flex gap-2">
                            <input type="text" id="input-master-Ben" onkeypress="handleEnter(event, 'master', 'Ben')" class="flex-1 bg-white border border-slate-200 rounded-lg py-2 px-3 text-sm text-slate-700 focus:outline-none focus:border-blue-500 transition-all" placeholder="Add to Ben's stash...">
                            <button onclick="addGift('master', 'Ben')" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2 font-bold transition-colors shadow-sm">Add</button>
                        </div>
                    </div>
                    <!-- Lev's Master List -->
                    <div class="bg-blue-50/50 rounded-xl p-5 border border-blue-100">
                        <label class="block text-lg font-bold text-blue-900 mb-4 flex items-center gap-2">
                            <span class="w-2 h-8 bg-blue-600 rounded-full inline-block"></span>
                            Lev's Stash
                        </label>
                        <ul id="master-list-Lev" class="space-y-2 mb-4 min-h-[50px]"></ul>
                        <div class="flex gap-2">
                            <input type="text" id="input-master-Lev" onkeypress="handleEnter(event, 'master', 'Lev')" class="flex-1 bg-white border border-slate-200 rounded-lg py-2 px-3 text-sm text-slate-700 focus:outline-none focus:border-blue-500 transition-all" placeholder="Add to Lev's stash...">
                            <button onclick="addGift('master', 'Lev')" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-4 py-2 font-bold transition-colors shadow-sm">Add</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Global Actions -->
        <div class="flex justify-center gap-4">
            <button onclick="clearData()" class="px-6 py-2 bg-red-100 hover:bg-red-200 text-red-700 border border-red-300 rounded-full font-semibold shadow-lg transition-colors flex items-center gap-2">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></svg>
                Reset Planner
            </button>
        </div>
    </main>

    <footer class="text-center text-blue-200 mt-16 text-sm">
        <p>Happy Hanukkah!</p>
    </footer>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getFirestore, doc, onSnapshot, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

        // --- 1. PASTE YOUR CONFIG HERE ---
        const firebaseConfig = {
            apiKey: "AIzaSyBIJNSO8FoY2hkUvWqEaITow9pMdDppskU",
            authDomain: "hanukkah-planner-a98b2.firebaseapp.com",
            projectId: "hanukkah-planner-a98b2",
            storageBucket: "hanukkah-planner-a98b2.firebasestorage.app",
            messagingSenderId: "48909103758",
            appId: "1:48909103758:web:06e399ef9f2e5fbccfcfdf"
        };

        // Initialize Firebase
        let db;
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            document.getElementById('connection-status').innerText = "Cloud Active";
        } catch (e) {
            console.error("Firebase config missing or invalid", e);
            document.getElementById('connection-status').innerText = "Setup Required: See Code";
            document.getElementById('connection-status').className = "text-xs text-red-400 mt-2 font-bold";
        }

        const kids = ["Ben", "Lev"];
        const totalDays = 8;
        
        // Default empty structure
        let appData = {};
        for (let i = 1; i <= totalDays; i++) { appData[i] = { Ben: [], Lev: [] }; }
        appData.master = { Ben: [], Lev: [] };
        
        let candleData = {};

        // --- Database Logic ---

        // Listen for real-time updates
        if (db) {
            const plannerRef = doc(db, "hanukkah", "planner_v1");
            const candleRef = doc(db, "hanukkah", "candles_v1");

            onSnapshot(plannerRef, (doc) => {
                if (doc.exists()) {
                    appData = doc.data();
                    renderAll();
                } else {
                    // Create if doesn't exist
                    setDoc(plannerRef, appData);
                }
            });

            onSnapshot(candleRef, (doc) => {
                if (doc.exists()) {
                    candleData = doc.data();
                    renderMenorah();
                } else {
                    setDoc(candleRef, candleData);
                }
            });
        }

        // Save Function
        window.saveData = function() {
            if (!db) return;
            const plannerRef = doc(db, "hanukkah", "planner_v1");
            setDoc(plannerRef, appData);
        };

        window.saveCandles = function() {
            if (!db) return;
            const candleRef = doc(db, "hanukkah", "candles_v1");
            setDoc(candleRef, candleData);
        };

        // --- Drag & Drop Logic ---
        
        window.dragStart = function(e, dayKey, kid, index) {
            e.dataTransfer.setData("text/plain", JSON.stringify({dayKey, kid, index}));
            e.dataTransfer.effectAllowed = "move";
            e.target.classList.add('dragging');
        }

        window.allowDrop = function(e) {
            e.preventDefault();
            e.dataTransfer.dropEffect = "move";
        }

        window.dropItem = function(e, targetDay, targetKid, targetIndex) {
            e.preventDefault();
            e.target.classList.remove('dragging');
            const data = JSON.parse(e.dataTransfer.getData("text/plain"));
            
            // Reorder only within same list (based on request for Stash Reordering)
            if (data.dayKey === String(targetDay) && data.kid === targetKid) {
                const list = appData[targetDay][targetKid];
                // Remove from old position
                const [movedItem] = list.splice(data.index, 1);
                // Insert at new position
                list.splice(targetIndex, 0, movedItem);
                
                window.saveData();
                renderAll(); // Immediate local render
            }
        }
        
        window.dragEnd = function(e) {
             e.target.classList.remove('dragging');
        }

        // --- UI Logic (Exposed to Window) ---

        window.renderAll = function() {
            renderNights();
            renderMasterList();
        }

        function renderNights() {
            const container = document.getElementById('days-container');
            container.innerHTML = '';

            for (let i = 1; i <= totalDays; i++) {
                const dayCard = document.createElement('div');
                dayCard.className = 'glass-panel rounded-xl overflow-hidden flex flex-col transition-transform hover:-translate-y-1 duration-300';
                
                dayCard.innerHTML = `
                    <div class="bg-blue-50/50 p-4 border-b border-blue-100 flex justify-between items-center">
                        <h2 class="text-xl font-bold text-blue-900">Night ${i}</h2>
                        <span class="text-2xl filter drop-shadow-sm">🕎</span>
                    </div>
                    <div class="p-4 space-y-6 flex-grow">
                        ${kids.map(kid => `
                            <div>
                                <label class="block text-sm font-bold text-slate-500 mb-2 uppercase tracking-wide">${kid}</label>
                                <ul class="space-y-2 mb-2 min-h-[10px]">${renderGiftList(i, kid)}</ul>
                                <div class="flex gap-2">
                                    <input type="text" id="input-${i}-${kid}" onkeypress="handleEnter(event, ${i}, '${kid}')" class="flex-1 bg-white border border-slate-200 rounded-lg py-1.5 px-3 text-sm focus:outline-none focus:border-blue-500 transition-all" placeholder="Add gift...">
                                    <button onclick="addGift(${i}, '${kid}')" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-3 py-1 text-lg font-bold transition-colors">+</button>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                container.appendChild(dayCard);
            }
        }

        function renderMasterList() {
            kids.forEach(kid => {
                const container = document.getElementById(`master-list-${kid}`);
                if (container) container.innerHTML = renderGiftList('master', kid);
            });
        }

        function renderGiftList(dayKey, kid) {
            const gifts = appData[dayKey][kid] || [];
            if (gifts.length === 0) return '';
            
            return gifts.map((giftObj, index) => {
                let options = '<option value="" disabled selected>Move to...</option>';
                if (dayKey !== 'master') options += `<option value="master">Return to Stash 🎁</option>`;
                for(let i=1; i<=8; i++) {
                    if (String(dayKey) !== String(i)) options += `<option value="${i}">Night ${i}</option>`;
                }

                // Determine Icon (Right arrow for Stash, Exchange/Move for Nights)
                const isMaster = dayKey === 'master';
                const icon = isMaster 
                    ? `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>`
                    : `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"></path></svg>`;
                
                const hoverClass = isMaster ? "hover:bg-blue-100 text-blue-500" : "hover:bg-purple-100 text-purple-500";

                return `
                    <li draggable="true" 
                        ondragstart="dragStart(event, '${dayKey}', '${kid}', ${index})"
                        ondragover="allowDrop(event)"
                        ondrop="dropItem(event, '${dayKey}', '${kid}', ${index})"
                        ondragend="dragEnd(event)"
                        class="draggable-item group flex items-center justify-between bg-white/60 rounded px-2 py-1.5 text-sm border border-slate-100 hover:border-blue-200 transition-colors">
                        <div class="flex items-center gap-2 flex-grow overflow-hidden pointer-events-none">
                            <label class="cursor-pointer relative flex items-center pointer-events-auto">
                                <input type="checkbox" class="gift-checkbox sr-only" ${giftObj.purchased ? 'checked' : ''} onchange="togglePurchased('${dayKey}', '${kid}', ${index})">
                                <div class="w-4 h-4 border-2 border-slate-300 rounded flex items-center justify-center transition-colors hover:border-blue-400">
                                    <svg class="w-3 h-3 text-white hidden pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                            </label>
                            <span class="truncate ${giftObj.purchased ? 'purchased-text' : 'text-slate-700'}">${giftObj.text}</span>
                        </div>
                        <div class="flex items-center">
                            
                            <!-- Icon-Only Move Button -->
                            <div class="relative mr-1">
                                <div class="p-1 rounded-full ${hoverClass} transition-colors cursor-pointer" title="Move Gift">
                                    ${icon}
                                </div>
                                <select onchange="moveGift('${dayKey}', '${kid}', ${index}, this.value)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                                    ${options}
                                </select>
                            </div>

                            <button onclick="removeGift('${dayKey}', '${kid}', ${index})" class="text-slate-300 hover:text-red-500 opacity-0 group-hover:opacity-100 transition-opacity px-1 font-bold ml-1">×</button>
                        </div>
                    </li>
                `;
            }).join('');
        }

        window.renderMenorah = function() {
            Object.keys(candleData).forEach(id => {
                const flame = document.getElementById(`flame-${id}`);
                if (flame) candleData[id] ? flame.classList.add('lit') : flame.classList.remove('lit');
            });
        }

        // Logic (Exposed to Window)
        window.handleEnter = function(e, dayKey, kid) {
            if (e.key === 'Enter') addGift(dayKey, kid);
        }

        window.addGift = function(dayKey, kid) {
            const input = document.getElementById(`input-${dayKey}-${kid}`);
            const value = input.value.trim();
            if (value) {
                appData[dayKey][kid].push({ text: value, purchased: false });
                input.value = '';
                window.saveData();
                setTimeout(() => {
                    const newInput = document.getElementById(`input-${dayKey}-${kid}`);
                    if(newInput) newInput.focus();
                }, 0);
            }
        }

        window.moveGift = function(sourceKey, kid, index, targetKey) {
            if (!targetKey || sourceKey === targetKey) return;
            const gift = appData[sourceKey][kid][index];
            appData[targetKey][kid].push(gift);
            appData[sourceKey][kid].splice(index, 1);
            window.saveData();
        }

        window.togglePurchased = function(dayKey, kid, index) {
            appData[dayKey][kid][index].purchased = !appData[dayKey][kid][index].purchased;
            window.saveData();
        }

        window.removeGift = function(dayKey, kid, index) {
            appData[dayKey][kid].splice(index, 1);
            window.saveData();
        }

        window.toggleCandle = function(id) {
            const flame = document.getElementById(`flame-${id}`);
            if (flame) {
                candleData[id] = !candleData[id]; // Toggle logic
                window.saveCandles();
            }
        }

        window.clearData = function() {
            if(confirm("Are you sure? This deletes the database for everyone!")) {
                // Reset structure
                for (let i = 1; i <= totalDays; i++) { appData[i] = { Ben: [], Lev: [] }; }
                appData.master = { Ben: [], Lev: [] };
                candleData = {};
                window.saveData();
                window.saveCandles();
            }
        }

        // Initial Render (will be overwritten when DB connects)
        renderAll();
        renderMenorah();
    </script>
</body>
</html>
